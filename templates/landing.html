<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataIA - Bienvenue</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(
          135deg,
          #0f0c29,
          #302b63,
          #24243e
        ); /* Alwen Dark AI */
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: "Poppins", sans-serif;
        margin: 0;
        overflow: hidden;
      }

      /* Spinner Style */
      #loader {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .spinner-border {
        width: 3rem;
        height: 3rem;
        color: #00d2ff; /* Couleur Bleu Neon */
      }

      /* Content Style (Caché au début) */
      #main-content {
        display: none;
        text-align: center;
        animation: fadeIn 1.5s ease-in-out;
      }

      .logo-img {
        width: 150px;
        filter: drop-shadow(0 0 10px #00d2ff);
        margin-bottom: 20px;
      }

      h1 {
        font-weight: 600;
        letter-spacing: 5px;
        text-transform: uppercase;
        background: linear-gradient(to right, #00d2ff, #3a7bd5);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .btn-custom {
        background: transparent;
        border: 2px solid #00d2ff;
        color: #00d2ff;
        padding: 10px 30px;
        border-radius: 30px;
        transition: 0.3s;
        text-decoration: none;
        font-weight: bold;
        margin: 10px;
      }

      .btn-custom:hover {
        background: #00d2ff;
        color: #0f0c29;
        box-shadow: 0 0 20px #00d2ff;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="spinner-border" role="status"></div>
      <p class="mt-3">Initialisation de l'IA...</p>
    </div>

    <div id="main-content">
      <img
        src="https://cdn-icons-png.flaticon.com/512/2103/2103633.png"
        alt="Logo DataIA"
        class="logo-img"
      />

      <h1>DataIA</h1>
      <p class="mb-5 text-secondary">
        Analyse intelligente de vos fichiers CSV et Excel
      </p>

      <div class="mt-4">
        <a href="{{ url_for('login') }}" class="btn-custom">Se Connecter</a>
        <a
          href="{{ url_for('signup') }}"
          class="btn-custom"
          style="border-color: #3a7bd5; color: #3a7bd5"
          >S'inscrire</a
        >
      </div>
    </div>

    <script>
      // Script bech el-loader yetna7a ba3d 2 secondes
      setTimeout(function () {
        document.getElementById("loader").style.display = "none";
        document.getElementById("main-content").style.display = "block";
      }, 2000);
    </script>
  </body>
</html>
