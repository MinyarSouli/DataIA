{% extends "base.html" %} {% block content %}
<div
  class="d-flex justify-content-center align-items-center"
  style="min-height: 80vh"
>
  <div
    class="card shadow-lg border-0"
    style="width: 100%; max-width: 450px; border-radius: 15px"
  >
    <div class="card-body p-5">
      <h3 class="text-center mb-4" style="color: #1e272e; font-weight: 600">
        Connexion
      </h3>
      <p class="text-muted text-center mb-4">
        Accédez à votre tableau de bord DataIA.
      </p>

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"
              ><i class="fas fa-at text-muted"></i
            ></span>
            <input
              type="email"
              name="email"
              class="form-control bg-light border-0"
              placeholder="votre@email.com"
              required
            />
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"
              ><i class="fas fa-key text-muted"></i
            ></span>
            <input
              type="password"
              name="password"
              class="form-control bg-light border-0"
              placeholder="••••••••"
              required
            />
          </div>
        </div>

        <button
          type="submit"
          class="btn w-100 py-2 shadow-sm"
          style="
            background: linear-gradient(45deg, #00d2d3, #0984e3);
            color: white;
            border-radius: 8px;
            font-weight: 600;
          "
        >
          Se connecter
        </button>
      </form>

      <div class="text-center mt-4">
        <small class="text-muted"
          >Nouveau ici ?
          <a
            href="{{ url_for('signup') }}"
            style="color: #1e272e; text-decoration: none; font-weight: 600"
            >Créer un compte</a
          ></small
        >
      </div>
    </div>
  </div>
</div>
{% endblock %}
